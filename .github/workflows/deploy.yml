name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cloudapp ./app

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cloudapp

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop cloudapp || true
          sudo docker rm cloudapp || true
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cloudapp
          sudo docker run -d -p 80:80 --name cloudapp ${{ secrets.DOCKER_USERNAME }}/cloudapp
